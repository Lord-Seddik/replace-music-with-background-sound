[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-remover"
version = "0.1.0"
description = "Remove background music from video while keeping speech and sound effects."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "soundfile",
    "torch",
    "torchaudio",
    "einops",
    "demucs>=4.0",
    "transformers>=4.40",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
music-remover = "musicremover.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
